<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EH</title>
<style>
  :root {
    --bg: #17181c;
    --panel: #202127;
    --line: #2e3038;
    --text: #e6e6e6;
    --dim: #8b8f9a;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.7 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    border-bottom: 1px solid var(--line);
    background: var(--panel);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  #state { font-size: 12px; color: var(--dim); }
  #state.running { color: var(--accent); }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 12px 16px 24px;
  }

  .step {
    margin-bottom: 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    overflow: hidden;
  }
  .step-head {
    padding: 6px 12px;
    background: #1c1d22;
    color: var(--dim);
    font-size: 12px;
    border-bottom: 1px solid var(--line);
  }
  .loop { padding: 4px 0 6px; }
  .loop + .loop { border-top: 1px dashed var(--line); }
  .loop-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 2px 12px;
    font-size: 12px;
    color: var(--dim);
  }
  .trace-btn {
    margin-left: auto;
    padding: 1px 8px;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: transparent;
    color: var(--accent);
    font-size: 12px;
    cursor: pointer;
  }
  .trace-btn:hover { border-color: var(--accent); }

  .row {
    display: grid;
    grid-template-columns: 128px 68px 1fr;
    gap: 8px;
    padding: 2px 12px;
    align-items: start;
  }
  .time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 12px; padding-top: 2px; }
  .src { font-size: 12px; }
  .src.外界消息 { color: #9ece6a; }
  .src.内心活动 { color: #bb9af7; }
  .src.工具调用 { color: #e0af68; }
  .src.工具返回 { color: #7dcfff; }
  .src.自由活动 { color: #f7768e; }
  .text { white-space: pre-wrap; word-break: break-word; }

  #live {
    margin-top: 8px;
    padding: 8px 10px;
    border-left: 2px solid var(--accent);
    background: #1c1e24;
    white-space: pre-wrap;
    word-break: break-word;
  }
  #live:empty { display: none; }

  footer {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    border-top: 1px solid var(--line);
    background: var(--panel);
  }
  #input {
    flex: 1;
    resize: none;
    height: 44px;
    padding: 10px 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #15161a;
    color: var(--text);
    font: inherit;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    width: 88px;
    border: 0;
    border-radius: 8px;
    background: var(--accent);
    color: #10131a;
    font-weight: 600;
    cursor: pointer;
  }
  #send:disabled { opacity: .5; cursor: default; }

  #drawer {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: min(620px, 92vw);
    background: #1b1c21;
    border-left: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    box-shadow: -12px 0 30px rgba(0,0,0,.35);
  }
  #drawer[hidden] { display: none; }
  .drawer-head {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }
  .drawer-head button {
    margin-left: auto;
    border: 0;
    background: transparent;
    color: var(--dim);
    font-size: 20px;
    cursor: pointer;
  }
  #drawer-body { flex: 1; overflow-y: auto; padding: 12px 14px; }
  #drawer-body h3 { margin: 14px 0 6px; font-size: 12px; color: var(--dim); font-weight: 600; }
  #drawer-body pre {
    margin: 0 0 8px;
    padding: 8px 10px;
    background: #141519;
    border: 1px solid var(--line);
    border-radius: 6px;
    white-space: pre-wrap;
    word-break: break-word;
    font: 12px/1.6 ui-monospace, SFMono-Regular, Menlo, monospace;
  }
</style>
</head>
<body>
<header>
  <h1>EH</h1>
  <span id="state">连接中…</span>
</header>

<main id="list">
  <div id="live"></div>
</main>

<footer>
  <textarea id="input" placeholder="跟她说点什么…（Enter 发送，Shift+Enter 换行）"></textarea>
  <button id="send">发送</button>
</footer>

<div id="drawer" hidden>
  <div class="drawer-head">
    <span id="drawer-title">请求</span>
    <button id="drawer-close">×</button>
  </div>
  <div id="drawer-body"></div>
</div>

<script type="module">
const list = document.getElementById('list')
const live = document.getElementById('live')
const stateEl = document.getElementById('state')
const input = document.getElementById('input')
const sendBtn = document.getElementById('send')
const drawer = document.getElementById('drawer')
const drawerTitle = document.getElementById('drawer-title')
const drawerBody = document.getElementById('drawer-body')
const drawerClose = document.getElementById('drawer-close')

let running = false

function el(tag, className) {
  const node = document.createElement(tag)
  if (className) node.className = className
  return node
}

function row(entry) {
  const div = el('div', 'row')
  const time = el('div', 'time'); time.textContent = entry.t
  const src = el('div', 'src ' + entry.src); src.textContent = entry.src
  const text = el('div', 'text'); text.textContent = entry.text
  div.append(time, src, text)
  return div
}

/** 按 step → loop 分组渲染 */
function render(entries) {
  const frag = document.createDocumentFragment()
  let stepKey = null
  let stepBlock = null
  let loopKey = null
  let loopBlock = null

  for (const entry of entries) {
    const thisStep = entry.step ?? '旧'
    if (thisStep !== stepKey) {
      stepBlock = el('div', 'step')
      const head = el('div', 'step-head')
      head.textContent = `step ${thisStep} · ${entry.t} · ${entry.src}`
      stepBlock.append(head)
      frag.append(stepBlock)
      stepKey = thisStep
      loopKey = null
    }

    const thisLoop = entry.loop ?? 0
    if (thisLoop !== loopKey) {
      loopBlock = el('div', 'loop')
      const head = el('div', 'loop-head')
      head.append(document.createTextNode(`loop ${thisLoop}`))
      if (typeof entry.step === 'number' && thisLoop > 0) {
        const btn = el('button', 'trace-btn')
        btn.textContent = '查看请求'
        btn.addEventListener('click', () => openTrace(entry.step, thisLoop))
        head.append(btn)
      }
      loopBlock.append(head)
      stepBlock.append(loopBlock)
      loopKey = thisLoop
    }

    loopBlock.append(row(entry))
  }

  list.replaceChildren(frag)
  list.append(live)
  list.scrollTop = list.scrollHeight
}

async function reload() {
  const entries = await (await fetch('/history')).json()
  render(entries)
}

function setState(state) {
  running = state === 'running'
  stateEl.textContent = running ? '运行中…' : '空闲'
  stateEl.className = running ? 'running' : ''
}

function ensureLive() {
  if (!live.isConnected) list.append(live)
  list.scrollTop = list.scrollHeight
}

async function openTrace(step, loop) {
  drawerTitle.textContent = `step ${step} · loop ${loop}`
  drawerBody.replaceChildren()
  drawer.hidden = false

  const res = await fetch(`/trace?step=${step}&loop=${loop}`)
  if (!res.ok) {
    const pre = el('pre'); pre.textContent = '没有这条记录（重启前的记录不会保留在内存里）'
    drawerBody.append(pre)
    return
  }

  const record = await res.json()
  const { system, messages, tools, response } = record

  if (record.historyShort) {
    const warn = el('pre')
    warn.textContent = '注意：历史被压缩过，当时的条数已经对不上（下面是按现有历史重建的）'
    drawerBody.append(warn)
  }

  drawerBody.append(section('请求 · system 提示词', system))
  messages.forEach((message, index) => {
    drawerBody.append(section(`请求 · messages[${index}] (${message.role})`, message.content))
  })
  drawerBody.append(section('请求 · tools', tools.join('\n') || '（无）'))
  drawerBody.append(section('响应 · 文字', response.text || '（无）'))
  drawerBody.append(section('响应 · 工具调用', response.toolCalls.length
    ? response.toolCalls.map(call => `${call.name}(${JSON.stringify(call.args)})`).join('\n')
    : '（无）'))
  drawerBody.append(section('响应 · 其他', `finish: ${response.finishReason}\nusage: ${JSON.stringify(response.usage ?? null)}`))
}

function section(title, body) {
  const wrap = document.createDocumentFragment()
  const h = el('h3'); h.textContent = title
  const pre = el('pre'); pre.textContent = body
  wrap.append(h, pre)
  return wrap
}

drawerClose.addEventListener('click', () => { drawer.hidden = true })

const events = new EventSource('/events')

events.onmessage = event => {
  const data = JSON.parse(event.data)
  if (data.type === 'state') {
    setState(data.state)
    if (data.state === 'idle') live.textContent = ''
  }
  if (data.type === 'text') {
    ensureLive()
    live.textContent += data.piece
    list.scrollTop = list.scrollHeight
  }
  if (data.type === 'done' || data.type === 'history') {
    live.textContent = ''
    reload()
  }
  if (data.type === 'error') {
    ensureLive()
    live.textContent += '\n[出错] ' + data.message
  }
}

async function send() {
  const text = input.value.trim()
  if (!text) return
  input.value = ''
  const res = await fetch('/say', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ text }),
  })
  if (!res.ok) {
    const info = await res.json().catch(() => ({}))
    alert(info.error ?? '发送失败')
  }
}

sendBtn.addEventListener('click', send)
input.addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey) {
    event.preventDefault()
    send()
  }
})

reload()
</script>
</body>
</html>
