<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Elio</title>
<script>
  if (new URLSearchParams(location.search).has('pet')) {
    document.documentElement.classList.add('pet')
  }
</script>
<style>
  :root {
    --line: rgba(255, 255, 255, .12);
    --dim: #8b8f9a;
    --accent: #7aa2f7;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    overflow: hidden;
    background: radial-gradient(circle at 50% 18%, #1d1f28 0%, #0b0c10 68%);
    color: #eee;
    font: 14px/1.7 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    color: var(--dim);
    font-size: 12px;
  }
  .brand {
    color: #e8e8e8;
    font-weight: 600;
    letter-spacing: .18em;
  }
  .meta { display: flex; align-items: center; gap: 14px; }
  .meta a { color: var(--accent); text-decoration: none; }
  .meta a:hover { text-decoration: underline; }

  .stage {
    position: relative;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 64px 20px 190px;
  }
  .portrait {
    display: block;
    max-height: calc(100vh - 250px);
    max-width: min(720px, 94vw);
    object-fit: contain;
    border-radius: 18px;
    opacity: .96;
    filter: drop-shadow(0 24px 80px rgba(0, 0, 0, .55));
    user-select: none;
    -webkit-user-drag: none;
  }

  .overlay {
    position: absolute;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    width: min(860px, 92vw);
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .dialogue {
    align-self: center;
    width: fit-content;
    max-width: 100%;
    min-height: 0;
    padding: 10px 14px;
    border: 1px solid var(--line);
    border-radius: 12px;
    background: rgba(14, 15, 20, .78);
    backdrop-filter: blur(12px);
    box-shadow: 0 10px 40px rgba(0, 0, 0, .35);
    font-size: clamp(16px, 1.8vw, 21px);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
  }
  .dialogue.speaking { border-color: rgba(122, 162, 247, .38); }

  .pet-controls {
    display: flex;
    align-items: center;
    justify-content: flex-end;
    gap: 8px;
  }
  .pet-size { display: none; }

  .volume {
    align-self: flex-end;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(14, 15, 20, .7);
    color: var(--dim);
    font-size: 12px;
  }
  .volume input {
    width: 120px;
    accent-color: var(--accent);
    cursor: pointer;
  }
  #volume-value {
    min-width: 34px;
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }
  .composer textarea {
    flex: 1;
    min-height: 38px;
    max-height: 110px;
    resize: none;
    padding: 9px 12px;
    border: 1px solid var(--line);
    border-radius: 10px;
    outline: none;
    background: rgba(14, 15, 20, .78);
    color: #eee;
    font: inherit;
    font-size: 14px;
    line-height: 1.45;
  }
  .composer textarea:focus { border-color: rgba(122, 162, 247, .5); }
  .composer button {
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 10px;
    background: var(--accent);
    color: #0b0c10;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  .composer button:hover { filter: brightness(1.08); }

  @media (max-width: 640px) {
    header { padding: 14px 16px; }
    .stage { padding: 56px 0 170px; }
    .portrait { max-height: calc(100vh - 210px); max-width: 100vw; border-radius: 0; }
    .overlay { bottom: 12px; width: calc(100vw - 24px); }
    .dialogue { min-height: 0; padding: 9px 12px; font-size: 17px; }
    .volume input { width: 90px; }
    .composer textarea { min-height: 36px; font-size: 14px; }
    .composer button { height: 36px; padding: 0 12px; }
  }

  /* 桌宠模式：只在 Electron 的 /stage?pet=1 里生效 */
  html.pet { --pet-scale: 1; }
  html.pet, html.pet body { background: transparent; }
  html.pet body {
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
  }
  html.pet textarea, html.pet input {
    user-select: text;
    -webkit-user-select: text;
  }
  html.pet header { display: none; }
  html.pet .stage {
    display: grid;
    grid-template-rows: minmax(0, 1fr) auto;
    align-items: stretch;
    justify-content: stretch;
    min-width: 0;
    padding: 8px;
    gap: 8px;
  }
  html.pet .portrait {
    align-self: center;
    justify-self: center;
    width: auto;
    height: auto;
    min-width: 0;
    min-height: 0;
    max-width: 100%;
    max-height: 100%;
    border-radius: 0;
    opacity: 1;
    filter: drop-shadow(0 18px 42px rgba(0, 0, 0, .5));
    -webkit-app-region: no-drag;
    cursor: grab;
  }
  html.pet .portrait:active { cursor: grabbing; }
  html.pet .overlay {
    position: relative;
    left: auto;
    bottom: auto;
    transform: none;
    width: min(100%, calc(100% * var(--pet-scale, 1)));
    min-width: 0;
    gap: calc(8px * var(--pet-scale, 1));
    justify-self: center;
    -webkit-app-region: no-drag;
  }
  html.pet .dialogue {
    min-width: 0;
    padding: calc(10px * var(--pet-scale, 1)) calc(14px * var(--pet-scale, 1));
    border-radius: calc(12px * var(--pet-scale, 1));
    font-size: calc(16px * var(--pet-scale, 1));
    background: rgba(14, 15, 20, .88);
    backdrop-filter: none;
  }
  html.pet .composer {
    min-width: 0;
    width: 100%;
    gap: calc(8px * var(--pet-scale, 1));
  }
  html.pet .composer textarea {
    min-width: 0;
    min-height: calc(38px * var(--pet-scale, 1));
    padding: calc(9px * var(--pet-scale, 1)) calc(12px * var(--pet-scale, 1));
    font-size: calc(14px * var(--pet-scale, 1));
  }
  html.pet .composer button {
    height: calc(38px * var(--pet-scale, 1));
    padding: 0 calc(16px * var(--pet-scale, 1));
    font-size: calc(14px * var(--pet-scale, 1));
  }
  html.pet .pet-controls {
    justify-content: space-between;
    min-width: 0;
    gap: calc(8px * var(--pet-scale, 1));
  }
  html.pet .pet-controls .pet-size,
  html.pet .pet-controls .volume {
    display: flex;
    flex: 1 1 0;
    min-width: 0;
    align-self: auto;
  }
  html.pet .pet-controls .pet-size {
    min-width: 120px;
  }
  html.pet .pet-controls .volume {
    min-width: 110px;
  }
  html.pet .pet-controls .pet-size input,
  html.pet .pet-controls .volume input {
    flex: 1 1 0;
    width: auto;
    min-width: 32px;
  }
  html.pet .pet-size input {
    accent-color: var(--accent);
    cursor: pointer;
  }
  html.pet.pet-resizing .portrait {
    filter: none;
  }
  html.pet .pet-size {
    align-items: center;
    gap: calc(8px * var(--pet-scale, 1));
    padding: calc(6px * var(--pet-scale, 1)) calc(10px * var(--pet-scale, 1));
    border: 1px solid var(--line);
    border-radius: 999px;
    background: rgba(14, 15, 20, .7);
    color: var(--dim);
    font-size: calc(12px * var(--pet-scale, 1));
    line-height: calc(20px * var(--pet-scale, 1));
  }
  html.pet .volume {
    gap: calc(8px * var(--pet-scale, 1));
    padding: calc(6px * var(--pet-scale, 1)) calc(12px * var(--pet-scale, 1));
    font-size: calc(12px * var(--pet-scale, 1));
    line-height: calc(20px * var(--pet-scale, 1));
  }
  html.pet .pet-size input,
  html.pet .volume input {
    height: calc(16px * var(--pet-scale, 1));
  }
  #pet-size-value,
  #volume-value {
    min-width: calc(34px * var(--pet-scale, 1));
  }
  #pet-size-value {
    text-align: right;
    font-variant-numeric: tabular-nums;
  }
</style>
</head>
<body>
<header>
  <span class="brand">Elio</span>
  <div class="meta">
    <span id="status">连接中…</span>
    <a href="/" target="_self">记录 ↗</a>
  </div>
</header>

<main class="stage">
  <img class="portrait" src="/assets/elio.png" alt="Elio">
  <div class="overlay">
    <div class="dialogue" id="dialogue" data-pet-interactive><span id="line">……</span></div>
    <div class="pet-controls" data-pet-interactive>
      <div class="pet-size">
        <span>尺寸</span>
        <input id="pet-size" type="range" min="70" max="110" step="1" value="100" aria-label="尺寸">
        <span id="pet-size-value">100%</span>
      </div>
      <div class="volume">
        <span id="volume-icon">🔊</span>
        <input id="volume" type="range" min="0" max="100" step="1" value="100" aria-label="音量">
        <span id="volume-value">100%</span>
      </div>
    </div>
    <form class="composer" id="composer" data-pet-interactive>
      <textarea id="input" rows="1" aria-label="输入消息"></textarea>
      <button type="submit">发送</button>
    </form>
  </div>
</main>

<script type="module">
const statusEl = document.getElementById('status')
const lineEl = document.getElementById('line')
const dialogueEl = document.getElementById('dialogue')
const volumeEl = document.getElementById('volume')
const volumeValueEl = document.getElementById('volume-value')
const volumeIconEl = document.getElementById('volume-icon')
const inputEl = document.getElementById('input')
const composerEl = document.getElementById('composer')
const portraitEl = document.querySelector('.portrait')
const petSizeEl = document.getElementById('pet-size')
const petSizeValueEl = document.getElementById('pet-size-value')

const petMode = document.documentElement.classList.contains('pet')
const petBridge = window.ehPet
let petIgnore = null
let petPointerDown = false
let draggingWindow = false
let spaceDown = false
let lastPointerX = 0
let lastPointerY = 0

const PUNCTUATION = new Set(['，', '。', '？', '！', '、'])
let typing = null
let typingTimer = null
let currentId = null
let draggingVolume = false
let composing = false
let compositionEndedAt = 0

function setStatus(text) {
  statusEl.textContent = text
}

function setVolumeDisplay(percent, updateSlider = true) {
  const value = Math.max(0, Math.min(100, Math.round(percent)))
  if (updateSlider) volumeEl.value = String(value)
  volumeValueEl.textContent = value === 0 ? '静音' : `${value}%`
  volumeIconEl.textContent = value === 0 ? '🔇' : '🔊'
}

function stopTyping() {
  if (typingTimer) clearTimeout(typingTimer)
  typingTimer = null
  typing = null
  dialogueEl.classList.remove('speaking')
}

function finishTyping() {
  if (typing) {
    lineEl.textContent = typing.chars.join('')
    typing = null
  }
  if (typingTimer) clearTimeout(typingTimer)
  typingTimer = null
  dialogueEl.classList.remove('speaking')
}

function showFull(text, id = currentId) {
  stopTyping()
  currentId = id
  lineEl.textContent = text
}

function estimateDuration(text) {
  return Math.max(800, [...text].length * 180)
}

function weightsOf(chars) {
  return chars.map(char => PUNCTUATION.has(char) ? 3 : 1)
}

function indexAtProgress(weights, progress) {
  const total = weights.reduce((sum, value) => sum + value, 0)
  if (total === 0) return 0
  const target = Math.max(0, Math.min(1, progress)) * total
  let seen = 0
  for (let i = 0; i < weights.length; i++) {
    seen += weights[i]
    if (seen >= target) return i
  }
  return weights.length
}

function startTyping(text, durationMs, startedAt, id) {
  stopTyping()
  currentId = id

  const chars = [...text]
  if (chars.length === 0) {
    lineEl.textContent = ''
    return
  }

  const weights = weightsOf(chars)
  const totalWeight = weights.reduce((sum, value) => sum + value, 0)
  const totalMs = durationMs > 0 ? durationMs : estimateDuration(text)
  const elapsed = Math.max(0, Date.now() - (startedAt || Date.now()))
  const progress = Math.min(1, elapsed / totalMs)
  let index = indexAtProgress(weights, progress)

  if (index >= chars.length) {
    showFull(text, id)
    return
  }

  const unitMs = Math.max(12, (totalMs * 0.85) / Math.max(1, totalWeight))
  typing = { chars, weights, index, unitMs, id }
  lineEl.textContent = chars.slice(0, index).join('')
  dialogueEl.classList.add('speaking')
  typeNext()
}

function typeNext() {
  if (!typing) return
  const { chars, weights, unitMs } = typing
  const index = typing.index

  if (index >= chars.length) {
    finishTyping()
    return
  }

  typing.index = index + 1
  lineEl.textContent = chars.slice(0, index + 1).join('')
  typingTimer = setTimeout(typeNext, Math.max(12, unitMs * weights[index]))
}

function applySpeech(snapshot) {
  if (!snapshot) return
  if (snapshot.current) {
    startTyping(
      snapshot.current.text,
      snapshot.current.durationMs,
      snapshot.current.startedAt,
      snapshot.current.id,
    )
    return
  }
  if (snapshot.last) {
    showFull(snapshot.last.text, snapshot.last.id)
    return
  }
  currentId = null
  stopTyping()
  lineEl.textContent = '……'
}

async function saveVolume(percent) {
  try {
    const res = await fetch('/volume', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ volume: percent / 100 }),
    })
    if (!res.ok) throw new Error('save failed')
  } catch {
    setStatus('音量保存失败')
  }
}

volumeEl.addEventListener('input', () => {
  draggingVolume = true
  setVolumeDisplay(Number(volumeEl.value), false)
})

volumeEl.addEventListener('change', () => {
  draggingVolume = false
  const percent = Number(volumeEl.value)
  setVolumeDisplay(percent, false)
  void saveVolume(percent)
})

function resizeInput() {
  inputEl.style.height = 'auto'
  inputEl.style.height = Math.min(110, inputEl.scrollHeight) + 'px'
}

async function sendMessage() {
  const text = inputEl.value.trim()
  if (!text) return

  inputEl.value = ''
  inputEl.style.height = ''

  try {
    const res = await fetch('/say', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ text }),
    })
    if (!res.ok) {
      const info = await res.json().catch(() => ({}))
      throw new Error(info.error || '发送失败')
    }
  } catch (error) {
    setStatus(error instanceof Error ? error.message : '发送失败')
    inputEl.value = text
    resizeInput()
  }
}

inputEl.addEventListener('input', resizeInput)
inputEl.addEventListener('compositionstart', () => { composing = true })
inputEl.addEventListener('compositionend', () => {
  composing = false
  compositionEndedAt = Date.now()
})
inputEl.addEventListener('keydown', event => {
  if (event.key !== 'Enter' || event.shiftKey) return
  if (composing || event.isComposing || event.keyCode === 229) return
  if (Date.now() - compositionEndedAt < 80) return
  event.preventDefault()
  void sendMessage()
})
composerEl.addEventListener('submit', event => {
  event.preventDefault()
  void sendMessage()
})

function isPetInteractiveAt(clientX, clientY) {
  const target = document.elementFromPoint(clientX, clientY)
  if (!target) return false
  if (target === portraitEl) return spaceDown
  return Boolean(target.closest?.('[data-pet-interactive]'))
}

function setPetIgnore(ignore) {
  if (!petMode || !petBridge) return
  if (petIgnore === ignore) return
  petIgnore = ignore
  petBridge.setIgnoreMouseEvents(ignore)
}

function updatePetIgnoreAt(clientX, clientY) {
  if (!petMode || !petBridge) return
  setPetIgnore(!isPetInteractiveAt(clientX, clientY))
}

function isEditableTarget(target) {
  return Boolean(target?.closest?.('input, textarea, button, a, [contenteditable="true"]'))
}

function isPetControlTarget(target) {
  return Boolean(target?.closest?.('.composer, .pet-controls'))
}

function startPetDrag(event) {
  if (!petMode || !petBridge?.dragStart || draggingWindow) return false
  if (event.button !== 0) return false
  if (!spaceDown) return false
  if (isEditableTarget(event.target) || isPetControlTarget(event.target)) return false

  draggingWindow = true
  petPointerDown = true
  petBridge.dragStart()
  setPetIgnore(false)
  try {
    event.target.setPointerCapture?.(event.pointerId)
  } catch {
    // 窗口移动后指针捕获可能已经失效，忽略即可。
  }
  event.preventDefault()
  return true
}

function endPetDrag() {
  if (!draggingWindow) return
  draggingWindow = false
  petPointerDown = false
  petBridge?.dragEnd()
  updatePetIgnoreAt(lastPointerX, lastPointerY)
}

function setPetSizeDisplay(percent) {
  document.documentElement.style.setProperty('--pet-scale', String(percent / 100))
  if (!petSizeValueEl) return
  petSizeValueEl.textContent = `${percent}%`
}

function applyPetSize(percent, persist = false) {
  const value = Math.max(70, Math.min(110, Math.round(percent)))
  setPetSizeDisplay(value)
  if (!petMode || !petBridge?.setScale) return
  if (persist) {
    try {
      localStorage.setItem('eh.petScale', String(value))
    } catch {
      // 存不了就算了，不影响这次调整。
    }
  }
  petBridge.setScale(value)
}

if (petMode && petBridge) {
  if (petSizeEl) {
    let saved = 100
    try {
      const raw = Number(localStorage.getItem('eh.petScale'))
      if (Number.isFinite(raw) && raw >= 70 && raw <= 110) saved = Math.round(raw)
    } catch {
      saved = 100
    }
    petSizeEl.value = String(saved)
    setPetSizeDisplay(saved)
    let sizeTimer = 0
    let pendingSize = saved
    let lastSizeAt = 0

    function beginPetSizeDrag() {
      document.documentElement.classList.add('pet-resizing')
    }

    function endPetSizeDrag() {
      document.documentElement.classList.remove('pet-resizing')
    }

    function schedulePetSize(value) {
      pendingSize = value
      if (sizeTimer) return
      const wait = Math.max(0, 33 - (performance.now() - lastSizeAt))
      sizeTimer = setTimeout(() => {
        sizeTimer = 0
        lastSizeAt = performance.now()
        applyPetSize(pendingSize, false)
      }, wait)
    }

    petSizeEl.addEventListener('pointerdown', beginPetSizeDrag)
    petSizeEl.addEventListener('pointerup', endPetSizeDrag)
    petSizeEl.addEventListener('pointercancel', endPetSizeDrag)
    document.addEventListener('pointerup', endPetSizeDrag, true)
    document.addEventListener('pointercancel', endPetSizeDrag, true)
    petSizeEl.addEventListener('input', () => {
      const value = Number(petSizeEl.value)
      setPetSizeDisplay(value)
      schedulePetSize(value)
    })
    petSizeEl.addEventListener('change', () => {
      if (sizeTimer) {
        clearTimeout(sizeTimer)
        sizeTimer = 0
      }
      applyPetSize(Number(petSizeEl.value), true)
      endPetSizeDrag()
    })
    window.addEventListener('blur', endPetSizeDrag)
    applyPetSize(saved, true)
  }

  setPetIgnore(false)

  document.addEventListener('mousemove', event => {
    if (petPointerDown || draggingWindow) return
    setPetIgnore(!isPetInteractiveAt(event.clientX, event.clientY))
  }, { passive: true })

  document.addEventListener('pointerdown', event => {
    lastPointerX = event.clientX
    lastPointerY = event.clientY
    petPointerDown = true
    startPetDrag(event)
  }, true)

  document.addEventListener('pointermove', event => {
    lastPointerX = event.clientX
    lastPointerY = event.clientY
  }, { passive: true })

  document.addEventListener('pointerup', () => {
    const wasDragging = draggingWindow
    petPointerDown = false
    if (wasDragging) endPetDrag()
    else updatePetIgnoreAt(lastPointerX, lastPointerY)
  }, true)

  document.addEventListener('pointercancel', () => {
    petPointerDown = false
    endPetDrag()
  }, true)

  document.addEventListener('keydown', event => {
    if (event.code !== 'Space' || event.repeat) return
    if (isEditableTarget(event.target) || isPetControlTarget(event.target)) return
    event.preventDefault()
    spaceDown = true
    setPetIgnore(false)
  })

  document.addEventListener('keyup', event => {
    if (event.code !== 'Space') return
    spaceDown = false
    if (!draggingWindow) updatePetIgnoreAt(lastPointerX, lastPointerY)
  })

  window.addEventListener('blur', () => {
    spaceDown = false
    petPointerDown = false
    endPetDrag()
    setPetIgnore(true)
  })

  document.addEventListener('mouseleave', () => {
    if (!petPointerDown && !draggingWindow) setPetIgnore(true)
  })
}

const events = new EventSource('/events')

events.onopen = () => setStatus('已连接')
events.onerror = () => setStatus('重连中…')

events.onmessage = event => {
  let data
  try {
    data = JSON.parse(event.data)
  } catch {
    return
  }

  if (data.type === 'state') {
    if (!draggingVolume && typeof data.volume === 'number') {
      setVolumeDisplay(data.volume * 100)
    }
    applySpeech(data.speech)
    return
  }

  if (data.type === 'speech-start') {
    startTyping(data.text, data.durationMs, data.startedAt, data.id)
    return
  }

  if (data.type === 'speech-end') {
    if (data.id === currentId) finishTyping()
    return
  }

  if (data.type === 'volume' && !draggingVolume) {
    setVolumeDisplay(data.volume * 100)
  }
}
</script>
</body>
</html>
