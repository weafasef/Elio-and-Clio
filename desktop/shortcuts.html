<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>快捷键设置</title>
<style>
  :root {
    --bg: #11131a;
    --card: #181b24;
    --line: rgba(255, 255, 255, .12);
    --dim: #8b8f9a;
    --text: #eceef4;
    --accent: #7aa2f7;
    --danger: #f7768e;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    padding: 24px;
    background: radial-gradient(circle at 50% 0%, #202638 0%, transparent 44%), var(--bg);
    color: var(--text);
    font: 13px/1.55 -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  }
  h1 { margin: 0 0 6px; font-size: 20px; letter-spacing: -.01em; }
  .intro { margin: 0 0 20px; color: var(--dim); font-size: 12px; }
  .rows {
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: var(--card);
  }
  .row {
    display: grid;
    grid-template-columns: 170px minmax(0, 1fr) 58px;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(255, 255, 255, .07);
  }
  .row:last-child { border-bottom: 0; }
  .label { color: #d8dbe4; font-size: 13px; }
  .shortcut {
    width: 100%;
    height: 34px;
    padding: 0 12px;
    border: 1px solid var(--line);
    border-radius: 8px;
    outline: none;
    background: #0d0f16;
    color: var(--text);
    font: 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    cursor: text;
  }
  .shortcut:focus {
    border-color: rgba(122, 162, 247, .8);
    box-shadow: 0 0 0 3px rgba(122, 162, 247, .12);
  }
  .shortcut.recording { color: var(--accent); }
  .clear {
    height: 30px;
    border: 1px solid var(--line);
    border-radius: 7px;
    background: transparent;
    color: var(--dim);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
  }
  .clear:hover { color: var(--text); background: rgba(255, 255, 255, .04); }
  .hint { margin: 12px 0 0; color: #666c79; font-size: 12px; }
  .error {
    min-height: 18px;
    margin: 12px 0 0;
    color: var(--danger);
    font-size: 12px;
    white-space: pre-wrap;
  }
  footer {
    display: flex;
    justify-content: flex-end;
    gap: 8px;
    margin-top: 18px;
  }
  footer button {
    height: 36px;
    padding: 0 18px;
    border: 1px solid transparent;
    border-radius: 9px;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  #cancel {
    border-color: var(--line);
    background: transparent;
    color: var(--dim);
  }
  #save {
    background: var(--accent);
    color: #0b0c10;
  }
  #save:disabled { opacity: .55; cursor: default; }
</style>
</head>
<body>
  <h1>快捷键设置</h1>
  <p class="intro">点一下输入框，然后直接按组合键。空着表示不启用这个快捷键。</p>

  <div class="rows">
    <div class="row">
      <span class="label">点击穿透</span>
      <input class="shortcut" data-action="toggleClickThrough" readonly autocomplete="off">
      <button class="clear" data-clear="toggleClickThrough">清除</button>
    </div>
    <div class="row">
      <span class="label">显示/隐藏 Elio</span>
      <input class="shortcut" data-action="toggleWindow" readonly autocomplete="off">
      <button class="clear" data-clear="toggleWindow">清除</button>
    </div>
    <div class="row">
      <span class="label">显示文字和进度条</span>
      <input class="shortcut" data-action="toggleTextControls" readonly autocomplete="off">
      <button class="clear" data-clear="toggleTextControls">清除</button>
    </div>
    <div class="row">
      <span class="label">显示输入框</span>
      <input class="shortcut" data-action="toggleComposer" readonly autocomplete="off">
      <button class="clear" data-clear="toggleComposer">清除</button>
    </div>
  </div>

  <p class="hint">至少需要一个 Command / Control / Alt 修饰键。保存时如果组合冲突，会在这里提示。</p>
  <p class="error" id="error"></p>

  <footer>
    <button id="cancel">取消</button>
    <button id="save">保存</button>
  </footer>

<script>
const bridge = window.ehPet
const inputs = [...document.querySelectorAll('.shortcut')]
const errorEl = document.getElementById('error')
const saveEl = document.getElementById('save')

function displayAccelerator(accelerator) {
  return accelerator
    .replace(/CommandOrControl/g, '⌘/Ctrl')
    .replace(/Command/g, '⌘')
    .replace(/Control/g, '⌃')
    .replace(/Alt/g, '⌥')
    .replace(/Shift/g, '⇧')
    .replace(/\+/g, '')
}

function setShortcut(input, accelerator) {
  input.dataset.accelerator = accelerator
  input.value = accelerator ? displayAccelerator(accelerator) : ''
}

function clearShortcut(input) {
  setShortcut(input, '')
  input.focus()
}

function keyName(event) {
  if (/^Key[A-Z]$/.test(event.code)) return event.code.slice(3)
  if (/^Digit[0-9]$/.test(event.code)) return event.code.slice(5)
  if (/^F[0-9]{1,2}$/.test(event.code)) return event.code
  const map = {
    Space: 'Space',
    Enter: 'Enter',
    Escape: 'Esc',
    Tab: 'Tab',
    Backspace: 'Backspace',
    Delete: 'Delete',
    ArrowUp: 'Up',
    ArrowDown: 'Down',
    ArrowLeft: 'Left',
    ArrowRight: 'Right',
    Home: 'Home',
    End: 'End',
    PageUp: 'PageUp',
    PageDown: 'PageDown',
    Insert: 'Insert',
  }
  return map[event.code] || ''
}

for (const input of inputs) {
  input.addEventListener('keydown', event => {
    event.preventDefault()
    event.stopPropagation()

    const isModifierOnly = ['Meta', 'Control', 'Alt', 'Shift'].includes(event.key)
    if (isModifierOnly) return

    if (!event.metaKey && !event.ctrlKey && !event.altKey) {
      if (event.key === 'Backspace' || event.key === 'Delete') {
        clearShortcut(input)
        return
      }
      if (event.key === 'Escape') {
        input.blur()
        return
      }
      errorEl.textContent = '快捷键至少要包含 Command、Control 或 Alt。'
      return
    }

    const key = keyName(event)
    if (!key) {
      errorEl.textContent = '这个按键暂不支持，请用字母、数字、方向键或功能键。'
      return
    }

    const modifiers = []
    if (event.metaKey) modifiers.push('Command')
    if (event.ctrlKey) modifiers.push('Control')
    if (event.altKey) modifiers.push('Alt')
    if (event.shiftKey) modifiers.push('Shift')
    const accelerator = [...modifiers, key].join('+')
    setShortcut(input, accelerator)
    errorEl.textContent = ''
  })

  input.addEventListener('focus', () => input.classList.add('recording'))
  input.addEventListener('blur', () => input.classList.remove('recording'))
}

for (const button of document.querySelectorAll('.clear')) {
  button.addEventListener('click', () => {
    const input = inputs.find(item => item.dataset.action === button.dataset.clear)
    if (input) clearShortcut(input)
  })
}

document.getElementById('cancel').addEventListener('click', () => {
  bridge?.closeShortcuts()
})

saveEl.addEventListener('click', async () => {
  if (!bridge?.saveShortcuts) {
    errorEl.textContent = '快捷键接口不可用。'
    return
  }

  const shortcuts = {}
  for (const input of inputs) {
    shortcuts[input.dataset.action] = input.dataset.accelerator || ''
  }

  saveEl.disabled = true
  errorEl.textContent = '保存中…'
  try {
    const result = await bridge.saveShortcuts(shortcuts)
    if (!result?.ok) {
      errorEl.textContent = result?.error || '保存失败'
      return
    }
    bridge.closeShortcuts()
  } catch (error) {
    errorEl.textContent = error instanceof Error ? error.message : '保存失败'
  } finally {
    saveEl.disabled = false
  }
})

async function loadShortcuts() {
  if (!bridge?.getShortcuts) {
    errorEl.textContent = '快捷键接口不可用。'
    return
  }
  try {
    const result = await bridge.getShortcuts()
    const shortcuts = result?.shortcuts || {}
    for (const input of inputs) {
      const accelerator = shortcuts[input.dataset.action] || ''
      setShortcut(input, accelerator)
    }
    if (Array.isArray(result?.errors) && result.errors.length > 0) {
      errorEl.textContent = result.errors.join('\n')
    }
  } catch (error) {
    errorEl.textContent = error instanceof Error ? error.message : '读取快捷键失败'
  }
}

loadShortcuts()
</script>
</body>
</html>
